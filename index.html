const subjectSelect=document.getElementById('subject'), countSelect=document.getElementById('count'), quiz=document.getElementById('quiz'), statusEl=document.getElementById('status'), progress=document.getElementById('progress'), result=document.getElementById('result');

function shuffle(a){const c=a.slice();for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;}
function updateProgress(){const answered=userAnswers.filter(v=>v!==null).length,total=currentQuestions.length;progress.style.width=total?(answered/total*100)+'%':'0%';if(!submitted)statusEl.textContent=`Question ${total?currentIndex+1:0} of ${total} · ${answered} answered`;}
function saveCurrentAnswer(){if(submitted||!currentQuestions.length)return;const selected=quiz.querySelector('input[name="current-option"]:checked');userAnswers[currentIndex]=selected?selected.value:null;}
function renderQuestion(){
 if(!currentQuestions.length)return;
 const item=currentQuestions[currentIndex];quiz.innerHTML='';
 const card=document.createElement('article');card.className='question';
 const heading=document.createElement('h3');heading.innerHTML=`<span class="qnum">Question ${currentIndex+1} of ${currentQuestions.length}</span>`;
 const prompt=document.createElement('p');prompt.textContent=item.q;prompt.style.fontSize='1.12rem';prompt.style.fontWeight='650';card.append(heading,prompt);
 const opts=document.createElement('div');opts.className='options';
 item.options.forEach(answer=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name='current-option';input.value=answer;input.checked=userAnswers[currentIndex]===answer;input.disabled=submitted;input.addEventListener('change',()=>{saveCurrentAnswer();updateProgress();});const span=document.createElement('span');span.textContent=answer;label.append(input,span);opts.appendChild(label);});
 card.appendChild(opts);
 if(submitted){const chosen=userAnswers[currentIndex],correct=chosen===item.answer,note=document.createElement('p');note.className=correct?'correct':'incorrect';note.textContent=chosen===null?`Not answered. Correct answer: ${item.answer}`:correct?'Correct!':`Incorrect. Correct answer: ${item.answer}`;card.appendChild(note);}
 quiz.appendChild(card);
 const nav=document.createElement('div');nav.className='action-row';
 const prev=document.createElement('button');prev.className='secondary';prev.textContent='← Previous';prev.disabled=currentIndex===0;prev.addEventListener('click',()=>{saveCurrentAnswer();currentIndex--;renderQuestion();});nav.appendChild(prev);
 if(currentIndex<currentQuestions.length-1){const next=document.createElement('button');next.textContent='Next question →';next.addEventListener('click',()=>{saveCurrentAnswer();currentIndex++;renderQuestion();});nav.appendChild(next);}

function startQuiz(){submitted=false;result.style.display='none';result.innerHTML='';currentQuestions=shuffle(questionBank[subjectSelect.value]).slice(0,Number(countSelect.value));currentIndex=0;userAnswers=Array(currentQuestions.length).fill(null);renderQuestion();window.scrollTo({top:0,behavior:'smooth'});}
function markQuiz(){
 if(submitted)return;saveCurrentAnswer();submitted=true;let score=0;currentQuestions.forEach((item,i)=>{if(userAnswers[i]===item.answer)score++;});
 const pct=Math.round(score/currentQuestions.length*100),message=pct>=80?'Excellent work!':pct>=60?'Good effort! Keep practising.':'Keep learning—you can improve with practice.';
 result.innerHTML=`<h2>Your result</h2><div class="score">${score} / ${currentQuestions.length}</div><p><strong>${pct}%</strong> — ${message}</p><p>Use Previous and Next to review your answers and see the correct answer for each question.</p>`;
 const reviewButton=document.createElement('button');reviewButton.textContent='Review questions';reviewButton.addEventListener('click',()=>{currentIndex=0;renderQuestion();quiz.scrollIntoView({behavior:'smooth',block:'start'});});
 const retry=document.createElement('button');retry.className='secondary';retry.style.marginLeft='8px';retry.textContent='Try another set';retry.addEventListener('click',startQuiz);
 result.append(reviewButton,retry);result.style.display='block';statusEl.textContent='Practice submitted. Your score is shown below.';renderQuestion();result.scrollIntoView({behavior:'smooth',block:'start'});
}
document.getElementById('start').addEventListener('click',startQuiz);
document.getElementById('reset').addEventListener('click',()=>{if(currentQuestions.length)startQuiz();else{quiz.innerHTML='';result.style.display='none';progress.style.width='0%';statusEl.textContent='Choose a subject and start when you are ready.';}});
</script></body></html>
